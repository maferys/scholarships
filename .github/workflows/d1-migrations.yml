# Applies migrations/ to the remote D1 database. Runs on demand and when main gets a new migration.
# Needs repository secrets CLOUDFLARE_API_TOKEN (D1 edit) and CLOUDFLARE_ACCOUNT_ID.
name: D1 migrations
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['migrations/**']
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set."
            exit 1
          fi
          if grep -q REPLACE_WITH_D1_DATABASE_ID wrangler.toml; then
            echo "::error::Put the D1 database id in wrangler.toml first."
            exit 1
          fi
          npx --yes wrangler@4 d1 migrations apply scholarships --remote
