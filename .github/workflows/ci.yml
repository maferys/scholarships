name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build (published rules only)
        run: npm run build
      - name: Check only rules reviewed in EN and ES are published
        run: node scripts/check-published.mjs
      - name: Build (with draft rules)
        run: npm run build:preview
