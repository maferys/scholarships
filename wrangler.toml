# Cloudflare Pages project config. This file is the source of truth for bindings: the dashboard
# shows them read-only. Create the D1 database (dashboard or `npx wrangler d1 create scholarships`),
# paste its id in both blocks below, then apply migrations (README "Deploy").
name = "scholarships"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "scholarships"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# Preview deployments (every branch except main) share the same database for now.
# D1 bindings are not inherited, so they are repeated here.
[[env.preview.d1_databases]]
binding = "DB"
database_name = "scholarships"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"
