# Texas TEFA rules. The statute (SB 2, Education Code §29.359) is tier 1;
# the Comptroller's Families page is tier 2. The statute says purchases must be at a
# "preapproved education service provider or vendor of educational products", so every
# rule requires an approved vendor. Technology follows §29.359(a)(8) and 34 TAC §16.406(9):
# it must be required by an approved provider or vendor or prescribed by a physician, capped at 10% of the award.
program: tx-tefa
defaults:
  segment: all
  source: tx-sb2
  effective_from: 2026-07-01
  effective_to: null
  last_verified: 2026-10-18
  verified_by: claude
  review_status: draft
  conditions:
    requires_approved_vendor: true
submit_tip:
  en: "Request payment in the Odyssey portal from an approved provider or vendor. Texas law does not allow paying you back directly, so don't pay out of pocket."
  es: "Solicite el pago en el portal de Odyssey a un proveedor o vendedor aprobado. La ley de Texas no permite reembolsarle directamente, así que no pague de su bolsillo."

rules:
  - category: edu.private_school_tuition
    segment: private_school
    status: allowed
    locator: "Education Code §29.359(a)(1)"
    quote: null
    conditions:
      requires_approved_vendor: false
    review_flag: "Quote and label from the owner's review checklist (2026-10-18), citing 34 TAC Ch. 16 Subch. E. Not yet checked against the codified TAC text."
    conditions_text:
      en: "Tuition and fees at an approved private school are allowed. Families buy through the TEFA Marketplace, which only lists approved providers and vendors."
      es: "Se permiten la colegiatura y las cuotas de una escuela privada aprobada. Las familias compran en el TEFA Marketplace, que solo incluye proveedores y vendedores aprobados."

  - category: edu.online_classes
    status: allowed
    locator: "Education Code §29.359(a)(1)"
    quote: null
    review_flag: "Quote and label from the owner's review checklist (2026-10-18), citing 34 TAC Ch. 16 Subch. E. Not yet checked against the codified TAC text."
    conditions_text:
      en: "Tuition and fees for an approved online course or program are allowed. The course does not need to earn credit, and it does not count toward the 10% technology cap."
      es: "Se permiten la colegiatura y las cuotas de un curso o programa en línea aprobado. El curso no tiene que dar créditos y no cuenta para el límite de tecnología del 10%."

  - category: books.textbooks
    status: allowed
    source: tx-tac-16
    supporting_sources: [tx-sb2]
    locator: "34 TAC §16.406(3); definition in §16.401"
    quote: "Printed or digital materials, supplies, or equipment that convey educational information to a student"
    conditions:
      requires_approved_vendor: false
    review_flag: "Quote and label from the owner's review checklist (2026-10-18), citing 34 TAC Ch. 16 Subch. E. Not yet checked against the codified TAC text."
    conditions_text:
      en: "Textbooks and instructional materials, printed or digital, are allowed for private school and homeschool students. Families buy through the TEFA Marketplace, which only lists approved providers and vendors."
      es: "Se permiten los libros de texto y los materiales de instrucción, impresos o digitales, para estudiantes de escuela privada y de educación en casa. Las familias compran en el TEFA Marketplace, que solo incluye proveedores y vendedores aprobados."

  - category: curriculum.packaged
    status: allowed
    source: tx-tac-16
    supporting_sources: [tx-sb2]
    locator: "34 TAC §16.406(3); definition in §16.401"
    quote: "Printed or digital materials, supplies, or equipment that convey educational information to a student"
    conditions:
      requires_approved_vendor: false
    review_flag: "Quote and label from the owner's review checklist (2026-10-18), citing 34 TAC Ch. 16 Subch. E. Not yet checked against the codified TAC text."
    conditions_text:
      en: "Curriculum counts as instructional materials, printed or digital, for private school and homeschool students. Families buy through the TEFA Marketplace, which only lists approved providers and vendors."
      es: "El currículo cuenta como material de instrucción, impreso o digital, para estudiantes de escuela privada y de educación en casa. Las familias compran en el TEFA Marketplace, que solo incluye proveedores y vendedores aprobados."

  - category: clothing.uniform
    segment: private_school
    status: allowed
    source: tx-tac-16
    supporting_sources: [tx-sb2]
    locator: "34 TAC §16.406(2)"
    quote: "uniforms required by a private school, higher education provider, or industry-based training program in which the child is enrolled"
    conditions:
      requires_approved_vendor: false
    review_flag: "Quote and label from the owner's review checklist (2026-10-18), citing 34 TAC Ch. 16 Subch. E. Not yet checked against the codified TAC text."
    conditions_text:
      en: "Uniforms are allowed when the private school requires them. Families buy through the TEFA Marketplace, which only lists approved providers and vendors."
      es: "Los uniformes se permiten cuando la escuela privada los exige. Las familias compran en el TEFA Marketplace, que solo incluye proveedores y vendedores aprobados."

  - category: edu.tutoring
    status: conditional
    source: tx-tac-16
    supporting_sources: [tx-families-page]
    locator: "34 TAC §16.406(6); §16.404; Education Code §29.358(b)(4)(B)"
    quote: "fees for educational services provided by a private tutor or teaching service"
    review_flag: "Quote and label from the owner's review checklist (2026-10-18), citing 34 TAC Ch. 16 Subch. E. Not yet checked against the codified TAC text."
    conditions_text:
      en: "Private tutoring from an approved provider is allowed. The tutor must show qualifications and a national criminal history record review dated within 30 days of the application."
      es: "Se permite la tutoría privada con un proveedor aprobado. El tutor debe mostrar sus calificaciones y una revisión nacional de antecedentes penales con fecha de hasta 30 días antes de la solicitud."

  - category: edu.testing
    status: allowed
    source: tx-families-page
    locator: "Approved expenses"
    quote: null
    conditions_text:
      en: "Academic assessments are an approved expense."
      es: "Las evaluaciones académicas son un gasto aprobado."

  - category: edu.therapy
    status: conditional
    source: tx-tac-16
    supporting_sources: [tx-families-page]
    locator: "34 TAC §16.406(7)"
    quote: "to the extent not covered by government benefits or by private insurance or provided by a public school"
    review_flag: "Quote and label from the owner's review checklist (2026-10-18), citing 34 TAC Ch. 16 Subch. E. Not yet checked against the codified TAC text."
    conditions_text:
      en: "Educational therapies are allowed only when they are not covered by government benefits such as Medicaid or by private insurance, and not provided by a public school."
      es: "Las terapias educativas se permiten solo cuando no las cubren beneficios del gobierno como Medicaid ni un seguro privado, y no las da una escuela pública."

  - category: transport.general
    status: conditional
    locator: "Education Code §29.359(a)(6)"
    quote: "fees for transportation provided by a fee-for-service transportation provider"
    conditions_text:
      en: "Only a fee-for-service transportation provider, for trips to and from approved providers."
      es: "Solo un proveedor de transporte que cobra por servicio, para ir y volver de proveedores aprobados."

  - category: food.general
    segment: private_school
    status: conditional
    locator: "Education Code §29.359(a)(9)"
    quote: null
    conditions_text:
      en: "Only breakfast or lunch provided by the private school during the school day."
      es: "Solo el desayuno o almuerzo que da la escuela privada durante el día escolar."

  - category: tech.computer
    status: conditional
    source: tx-sb2
    supporting_sources: [tx-tac-16, odyssey-purchase-restrictions]
    conditions:
      requires_approved_vendor: true
      pct_of_award_cap: 0.10
    locator: "Education Code §29.359(a)(8); 34 TAC §16.406(9); item list from Odyssey purchase restrictions (updated 2026-10-05)"
    quote: "required by an education service provider or vendor of educational products"
    review_flag: "Confirm the codified text of 34 TAC §16.406(9) reads 'required by any approved provider or vendor', as the Texas Register adoption preamble (2025-12-12) says. The physician clause comes from Education Code §29.359(a)(8) ('or prescribed by a physician') and the owner's checklist."
    conditions_text:
      en: "Laptops and desktops fall under the technology cap. The purchase is allowed only if an approved education provider or vendor requires it, for example an online course, or a physician prescribes it. Being a homeschool family does not qualify on its own. Technology purchases together are capped at 10% of the student's annual award amount: about $200 for the $2,000 homeschool award, or about $1,047 for the $10,474 private school award."
      es: "Las laptops y computadoras de escritorio entran en el límite de tecnología. La compra solo se permite si la exige un proveedor o vendedor educativo aprobado, por ejemplo un curso en línea, o si la receta un médico. Ser una familia que educa en casa no basta por sí solo. Las compras de tecnología en conjunto tienen un límite del 10% de la beca anual del estudiante: unos $200 para la beca de $2,000 de educación en casa, o unos $1,047 para la beca de $10,474 de escuela privada."

