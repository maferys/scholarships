  - category: tech.game_console
    status: not_allowed
    source: tx-tac-16
    locator: "34 TAC §16.406 (closed list of approved expenses)"
    quote: "Program money may be used only at an approved provider for the following"
    review_flag: "Quote and label from the owner's review checklist (2026-10-18), citing 34 TAC Ch. 16 Subch. E. Not yet checked against the codified TAC text."
    conditions_text:
      en: "Game consoles are not in the list of approved expenses, and the list is closed. The only exception would be a device an approved provider requires or a physician prescribes, which is rare."
      es: "Las consolas de videojuegos no están en la lista de gastos aprobados, y la lista es cerrada. La única excepción sería un aparato que exija un proveedor aprobado o recete un médico, lo cual es raro."
