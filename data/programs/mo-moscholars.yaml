student_segments: [all]
school_year: "2026-27"
program_status: settling
status_note:
  en: "A court challenge to the program's $50 million state appropriation was dismissed in Cole County in April 2026, and the teachers' union said it would appeal. Purchases now go through Odyssey, while the Treasurer's handbook still describes the previous platform."
  es: "En abril de 2026, un tribunal del condado de Cole desestimó una demanda contra la asignación estatal de $50 millones del programa, y el sindicato de maestros dijo que apelaría. Las compras ahora se hacen en Odyssey, aunque el manual del Tesorero todavía describe la plataforma anterior."
status_verified_date: 2026-10-19
who_gets_funds_note:
  en: "Scholarships are awarded and funded by an Educational Assistance Organization (EAO), so being eligible does not mean your child has a funded account. Check your Odyssey account. Awards are a share of the State Adequacy Target: up to 175% with an IEP, 160% for English learners, 125% with free or reduced-price lunch, and 100% otherwise. Some EAOs fund only up to the school's tuition."
  es: "Las becas las otorga y financia una Organización de Asistencia Educativa (EAO), así que ser elegible no significa que su hijo tenga una cuenta con fondos. Revise su cuenta de Odyssey. Las becas son un porcentaje del State Adequacy Target: hasta 175% con un IEP, 160% para estudiantes de inglés, 125% con almuerzo gratis o a precio reducido y 100% en los demás casos. Algunas EAO solo financian hasta el costo de la colegiatura de la escuela."
requires_funded_account_gate: true
