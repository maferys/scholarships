    review_flag: "document_date is approximate (2025 session). Confirm the subsection letters against the current official compilation: the rules cite 21-2-904(b)(i), as read from the bill text, but WDE's 2025 expense guidance heads its list 'W.S. 21-2-904(c)(i)(A)-(O)'. Checked 2026-10-19: the 2025 enrolled act (HB0199) amends '(b) ... (i) Requires use of the ESA funds for the following qualifying expenses' and does not renumber, so (b)(i) looks right and the guidance's (c) looks like a typo."
