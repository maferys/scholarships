school_year: "2026-27"
program_status: settling
status_note:
  en: "The Wyoming Supreme Court lifted the injunction in May 2026 and the program is running, while the lawsuit over the program continues in district court. The expense guidance dates from 2025 and is still the one the 2026-27 handbook cites."
  es: "La Corte Suprema de Wyoming levantó la orden judicial en mayo de 2026 y el programa está funcionando, mientras la demanda contra el programa sigue en el tribunal de distrito. La guía de gastos es de 2025 y sigue siendo la que cita el manual 2026-27."
status_verified_date: 2026-10-19
who_gets_funds_note:
  en: "Eligible students receive $7,000 for 2026-27, deposited in four equal parts starting around September 1, then early November, early February and early May. The 2026-27 application closed on August 6, 2026. Check your Odyssey account to see whether your child is funded."
  es: "Los estudiantes elegibles reciben $7,000 para 2026-27, depositados en cuatro partes iguales a partir del 1 de septiembre aproximadamente, y luego a principios de noviembre, febrero y mayo. La solicitud para 2026-27 cerró el 6 de agosto de 2026. Revise su cuenta de Odyssey para ver si su hijo tiene fondos."
requires_funded_account_gate: true
